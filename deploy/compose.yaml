services:
  komari:
    image: ghcr.io/mghts/komari:${KOMARI_VERSION:?Set KOMARI_VERSION in .env}
    restart: unless-stopped
    ports:
      - ${KOMARI_BIND:-127.0.0.1}:${KOMARI_PORT:-25774}:25774
    volumes:
      - type: bind
        source: ${KOMARI_DATA_DIR:-./data}
        target: /app/data
    environment:
      TZ: ${TZ:-Asia/Singapore}
