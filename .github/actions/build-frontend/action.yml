name: Build frontend theme
description: Clone komari-web, build the default theme, and optionally upload it as an artifact.

inputs:
  node-version:
    description: Node.js version used to build komari-web.
    default: "22"
  repository:
    description: Optional repository URL; must match build/frontend.json.
    default: ""
  ref:
    description: Optional full commit; must match build/frontend.json.
    default: ""
  artifact-name:
    description: Optional artifact name for the packed frontend theme.
    default: ""

runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}

    - name: Clone and build frontend
      shell: bash
      env:
        REQUESTED_REPOSITORY: ${{ inputs.repository }}
        REQUESTED_REF: ${{ inputs.ref }}
      run: |
        set -euo pipefail
        repository="$(node -p "'https://github.com/'+require('./build/frontend.json').repository")"
        ref="$(node -p "require('./build/frontend.json').commit")"
        [[ "$ref" =~ ^[0-9a-f]{40}$ ]]
        [[ -z "$REQUESTED_REPOSITORY" || "$REQUESTED_REPOSITORY" = "$repository" ]]
        [[ -z "$REQUESTED_REF" || "$REQUESTED_REF" = "$ref" ]]
        workspace="$PWD"
        checkout="$(mktemp -d "$RUNNER_TEMP/komari-frontend.XXXXXXXX")"
        git -C "$checkout" init
        git -C "$checkout" remote add origin "$repository"
        git -C "$checkout" fetch --depth=1 origin "$ref"
        git -C "$checkout" checkout --detach FETCH_HEAD
        test "$(git -C "$checkout" rev-parse HEAD)" = "$ref"
        cd "$checkout"
        npm ci --no-audit --no-fund
        npm run check:fork -- "$workspace/build/agent.json"
        SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)" npm run build
        cd "$workspace"
        destination=web/public/defaultTheme
        if [ -e "$destination" ]; then
          backup="$(mktemp -d "$RUNNER_TEMP/komari-theme-backup.XXXXXXXX")"
          mv "$destination" "$backup/defaultTheme"
        fi
        mkdir -p "$destination"
        cp -R "$checkout/dist" "$destination/dist"
        cp "$checkout/komari-theme.json" "$destination/"
        for name in preview.png perview.png; do
          if [ -f "$checkout/$name" ]; then cp "$checkout/$name" "$destination/$name"; fi
        done

    - name: Pack frontend artifact
      if: ${{ inputs.artifact-name != '' }}
      shell: bash
      run: |
        set -euxo pipefail
        tar -czf "$RUNNER_TEMP/${{ inputs.artifact-name }}.tar.gz" -C web/public/defaultTheme .

    - name: Upload frontend artifact
      if: ${{ inputs.artifact-name != '' }}
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ runner.temp }}/${{ inputs.artifact-name }}.tar.gz
